<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASM Google Sign-in Drive Test</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 1rem; }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.2rem; color: #1e3a8a; margin: 0 0 0.25rem; }
    .sub { font-size: 0.8rem; color: #64748b; margin-bottom: 1rem; }
    .box { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; }
    input { width: 100%; padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }
    button { width: 100%; padding: 0.8rem; border: 0; border-radius: 8px; font-size: 0.95rem; font-weight: 600; color: #fff; background: #1e3a8a; margin-top: 0.6rem; cursor: pointer; }
    button.green { background: #16a34a; }
    button.grey { background: #64748b; }
    button.red { background: #dc2626; }
    button:disabled { opacity: 0.5; }
    #status { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
    #log { background: #0f172a; color: #e2e8f0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.75rem; border-radius: 10px; padding: 0.75rem; min-height: 150px; white-space: pre-wrap; word-break: break-word; }
    .ok { color: #4ade80; } .bad { color: #f87171; } .info { color: #93c5fd; }
    .note { font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Google Sign-in Drive Test</h1>
    <div class="sub">A.S.M Consultancy Services - test page only. Uses the folder "ASM Backups TEST". No ledger data.</div>

    <div class="box">
        <label for="clientId">Client ID</label>
        <input type="text" id="clientId" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="grey" onclick="saveClientId()">Save Client ID</button>
        <div class="note">Paste the Client ID from Google Cloud once. It is saved on this phone only.</div>
    </div>

    <div class="box">
        <div id="status">Not signed in</div>
        <button type="button" onclick="doSignIn()">1. Sign in with Google</button>
        <button type="button" class="green" onclick="doSave()">2. Save test file (creates folder first time)</button>
        <button type="button" class="green" onclick="doSave()">3. Press again to overwrite</button>
        <button type="button" class="grey" onclick="doList()">4. List files in folder</button>
        <button type="button" class="grey" onclick="doRead()">5. Read the test file back</button>
        <button type="button" class="red" onclick="doCleanup()">6. Delete test folder (clean up)</button>
    </div>

    <div id="log">Ready. Open this page from your GitHub address, not from a file on the phone.</div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    const SCOPE = 'https://www.googleapis.com/auth/drive.file';
    const FOLDER_NAME = 'ASM Backups TEST';
    const FILE_NAME = 'asm-signin-test.json';
    const CID_KEY = 'asm_test_clientId';

    let accessToken = null;
    let tokenExpiry = 0;
    let tokenClient = null;
    let tokenWaiter = null;

    // ---------- log + status ----------
    function log(msg, cls) {
        if (msg === 'Not ready') return;   // reason already shown above
        const el = document.getElementById('log');
        const line = document.createElement('div');
        line.className = cls || '';
        line.textContent = new Date().toLocaleTimeString() + '  ' + msg;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
    }
    function setStatus(text, color) {
        const s = document.getElementById('status');
        s.textContent = text;
        s.style.color = color || '#0f172a';
    }

    // ---------- client id ----------
    function getClientId() {
        try { return localStorage.getItem(CID_KEY) || ''; } catch (e) { return ''; }
    }
    function saveClientId() {
        const v = document.getElementById('clientId').value.trim();
        if (!/\.apps\.googleusercontent\.com$/.test(v)) {
            log('That does not look like a Client ID. It must end with .apps.googleusercontent.com', 'bad');
            return;
        }
        try { localStorage.setItem(CID_KEY, v); } catch (e) {}
        tokenClient = null;   // rebuild with the new id
        log('Client ID saved.', 'ok');
    }

    // ---------- sign in ----------
    function ensureTokenClient() {
        if (tokenClient) return true;
        const cid = getClientId();
        if (!cid) { log('Save your Client ID first.', 'bad'); return false; }
        if (!(window.google && google.accounts && google.accounts.oauth2)) {
            log('Google sign-in script has not loaded. Check internet and try again. (WhatsApp browser may block it - use Chrome.)', 'bad');
            return false;
        }
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: cid,
            scope: SCOPE,
            callback: function (resp) {
                if (resp && resp.access_token) {
                    accessToken = resp.access_token;
                    tokenExpiry = Date.now() + (Number(resp.expires_in || 3600) * 1000);
                    setStatus('Signed in', '#16a34a');
                    log('Signed in. Permission lasts about ' + Math.round(Number(resp.expires_in || 3600) / 60) + ' minutes.', 'ok');
                    if (tokenWaiter) { tokenWaiter.resolve(accessToken); tokenWaiter = null; }
                } else {
                    const why = (resp && (resp.error_description || resp.error)) || 'No token received';
                    log('Sign-in failed: ' + why, 'bad');
                    if (tokenWaiter) { tokenWaiter.reject(new Error(why)); tokenWaiter = null; }
                }
            },
            error_callback: function (err) {
                const why = (err && (err.type || err.message)) || 'popup problem';
                log('Sign-in popup problem: ' + why, 'bad');
                if (tokenWaiter) { tokenWaiter.reject(new Error(why)); tokenWaiter = null; }
            }
        });
        return true;
    }

    function getToken() {
        if (accessToken && Date.now() < tokenExpiry - 60000) return Promise.resolve(accessToken);
        if (!ensureTokenClient()) return Promise.reject(new Error('Not ready'));
        return new Promise(function (resolve, reject) {
            tokenWaiter = { resolve: resolve, reject: reject };
            tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
        });
    }

    function doSignIn() {
        getToken().catch(function () {});
    }

    // ---------- Drive helpers ----------
    async function api(url, opts) {
        const token = await getToken();
        opts = opts || {};
        opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
        const res = await fetch(url, opts);
        if (!res.ok) {
            let text = '';
            try { text = await res.text(); } catch (e) {}
            throw new Error('Drive said ' + res.status + ' ' + text.slice(0, 200));
        }
        return res;
    }

    async function findFolder() {
        const q = "name='" + FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false";
        const r = await api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)&spaces=drive');
        const j = await r.json();
        return (j.files && j.files[0]) ? j.files[0] : null;
    }
    async function ensureFolder() {
        let f = await findFolder();
        if (f) { log('Folder found: ' + FOLDER_NAME, 'info'); return f; }
        const r = await api('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
        });
        f = await r.json();
        log('Folder created: ' + FOLDER_NAME, 'ok');
        return f;
    }
    async function findFile(folderId) {
        const q = "name='" + FILE_NAME + "' and '" + folderId + "' in parents and trashed=false";
        const r = await api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name,modifiedTime)&spaces=drive');
        const j = await r.json();
        return (j.files && j.files[0]) ? j.files[0] : null;
    }

    // ---------- actions ----------
    async function doSave() {
        try {
            const folder = await ensureFolder();
            const existing = await findFile(folder.id);
            const content = JSON.stringify({ app: 'signin-test', savedAt: new Date().toISOString(), note: 'test file' });
            if (existing) {
                await api('https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=media', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: content
                });
                log('Overwritten the same file (' + FILE_NAME + '). No second copy made.', 'ok');
            } else {
                const boundary = 'asmboundary' + Date.now();
                const meta = JSON.stringify({ name: FILE_NAME, parents: [folder.id], mimeType: 'application/json' });
                const body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta +
                    '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + content + '\r\n--' + boundary + '--';
                await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
                    body: body
                });
                log('Created ' + FILE_NAME + ' inside ' + FOLDER_NAME + '. Check your Google Drive.', 'ok');
            }
        } catch (e) { log(e.message, 'bad'); }
    }

    async function doList() {
        try {
            const folder = await findFolder();
            if (!folder) { log('Folder ' + FOLDER_NAME + ' not found yet. Press 2 first.', 'info'); return; }
            const q = "'" + folder.id + "' in parents and trashed=false";
            const r = await api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name,modifiedTime)&spaces=drive');
            const j = await r.json();
            if (!j.files || !j.files.length) { log('Folder is empty.', 'info'); return; }
            j.files.forEach(function (f) { log('File: ' + f.name + '   (modified ' + f.modifiedTime + ')', 'info'); });
        } catch (e) { log(e.message, 'bad'); }
    }

    async function doRead() {
        try {
            const folder = await findFolder();
            const file = folder ? await findFile(folder.id) : null;
            if (!file) { log('Test file not found. Press 2 first.', 'info'); return; }
            const r = await api('https://www.googleapis.com/drive/v3/files/' + file.id + '?alt=media');
            log('Read back: ' + (await r.text()), 'ok');
        } catch (e) { log(e.message, 'bad'); }
    }

    async function doCleanup() {
        try {
            const folder = await findFolder();
            if (!folder) { log('Nothing to delete.', 'info'); return; }
            await api('https://www.googleapis.com/drive/v3/files/' + folder.id, { method: 'DELETE' });
            log('Test folder deleted from your Drive.', 'ok');
        } catch (e) { log(e.message, 'bad'); }
    }

    // ---------- start ----------
    (function init() {
        const cid = getClientId();
        if (cid) document.getElementById('clientId').value = cid;
    })();
</script>
</body>
</html>
